<!DOCTYPE html>
<html lang="ja">
<head>

<script>

if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {

window.location.href =
"https://kurayume-sra.github.io/sra-organization-dossier-mobile/";

}

</script>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SRA ORGANIZATION DOSSIER</title>

<style>

html, body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:black;

    color:white;

    font-family:
    "Times New Roman", serif;
}

.viewer{

    width:100vw;
    height:100vh;

    display:flex;

    overflow-x:auto;

    scroll-snap-type:x mandatory;

    scroll-behavior:smooth;
}

.slide{

    flex:0 0 100vw;

    width:100vw;
    height:100vh;

    overflow:auto;

    scroll-snap-align:start;

    background:black;

    display:flex;

    justify-content:center;
    align-items:center;

    position:relative;
}

.slide img{

    max-width:100%;
    max-height:100%;

    object-fit:contain;

    cursor:zoom-in;

    transition:0.25s ease;

    user-select:none;
}

.slide.zoomed{

    justify-content:flex-start;
    align-items:flex-start;

    overflow:auto;
}

.slide.zoomed img{

    max-width:none;
    max-height:none;

    width:1800px;
    height:auto;

    cursor:zoom-out;

    margin:40px;
}

.overlay{

    position:fixed;

    top:18px;
    left:24px;

    z-index:10;

    opacity:0.7;

    letter-spacing:2px;

    font-size:13px;
}

.counter{

    position:fixed;

    bottom:20px;
    right:24px;

    z-index:10;

    opacity:0.7;

    font-size:13px;
}

.nav{

    position:fixed;

    top:50%;

    transform:translateY(-50%);

    z-index:20;

    width:58px;
    height:58px;

    border:none;

    border-radius:999px;

    background:rgba(255,255,255,0.08);

    color:white;

    font-size:28px;

    cursor:pointer;
}

.prev{
    left:18px;
}

.next{
    right:18px;
}

.slide.zoomed ~ .nav{
    display:none;
}

</style>
</head>

<body>

<div class="overlay">

SRA ORGANIZATION DOSSIER

</div>

<div class="counter" id="counter">

1 / 4

</div>

<button class="nav prev"
onclick="moveSlide(-1)">
‹
</button>

<button class="nav next"
onclick="moveSlide(1)">
›
</button>

<div class="viewer" id="viewer">

<div class="slide">
<img src="①SRA表紙.png">
</div>

<div class="slide">
<img src="②組織図.png">
</div>

<div class="slide">
<img src="③組織人物紹介.png">
</div>

<div class="slide">
<img src="④監視対象と拠点紹介.png">
</div>

</div>

<script>

const viewer =
document.getElementById("viewer");

const counter =
document.getElementById("counter");

let current = 0;

const total = 4;

function moveSlide(dir){

    current += dir;

    if(current < 0)
    current = 0;

    if(current >= total)
    current = total - 1;

    viewer.scrollTo({

        left:
        window.innerWidth * current,

        behavior:'smooth'
    });

    updateCounter();
}

function updateCounter(){

    counter.innerText =
    `${current + 1} / ${total}`;
}

viewer.addEventListener('scroll', () => {

    current = Math.round(
        viewer.scrollLeft
        / window.innerWidth
    );

    updateCounter();
});

document.querySelectorAll('.slide')
.forEach(slide => {

    const img = slide.querySelector('img');

    img.addEventListener('click', () => {

        slide.classList.toggle('zoomed');

    });

});

</script>

</body>
</html>
